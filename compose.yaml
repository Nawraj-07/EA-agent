services:
  backend:
    build: ./backend
    ports:
      - "8008:8000"
    env_file:
      - ./.env
    volumes:
      - ./backend/token.json:/app/token.json
      - buddy_auth:/app/auth_data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3003:3000"
    environment:
      VITE_API_URL: http://localhost:8008
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  buddy_auth: