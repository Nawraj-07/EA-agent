services:
  backend:
    build: ./backend
    ports:
      - "8008:8000"
    env_file:
      - ./.env
    volumes:
      # Mount source so WhatsApp/client fixes apply without image rebuild.
      - ./backend:/app
      - buddy_auth:/app/auth_data
    restart: "no"

  frontend:
    build: ./frontend
    ports:
      - "3003:3000"
    environment:
      VITE_API_URL: http://localhost:8008
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  buddy_auth: